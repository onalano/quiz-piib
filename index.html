<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz PIIB</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .app {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #174a7e;
        }

        .main-button {
            width: 100%;
            padding: 16px;
            margin-top: 15px;
            background: #174a7e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .answer {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: white;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
        }

        .answer:hover {
            background: #eef4fa;
        }

        .correct {
            background: #d9f7df;
            border-color: green;
        }

        .wrong {
            background: #ffdede;
            border-color: red;
        }

        #quiz-screen,
        #result-screen,
        #explanation,
        #next-button {
            display: none;
        }

        #explanation {
            margin-top: 20px;
            padding: 15px;
            background: #eef4fa;
            border-radius: 10px;
        }

        .progress {
            color: #666;
            font-size: 14px;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
            color: #174a7e;
        }

    </style>

</head>


<body>

<div class="app">


    <!-- START -->

    <div id="start-screen">

        <h1>Quiz PIIB</h1>

        <p>
            Przygotowanie do egzaminu na uprawnienia budowlane
        </p>

        <button class="main-button" onclick="startQuiz()">
            Rozpocznij test
        </button>

    </div>


    <!-- QUIZ -->

    <div id="quiz-screen">

        <p class="progress" id="progress">
            Pytanie
        </p>

        <h2 id="question">
            Pytanie
        </h2>


        <button class="answer" id="answer0" onclick="checkAnswer(0)">
        </button>

        <button class="answer" id="answer1" onclick="checkAnswer(1)">
        </button>

        <button class="answer" id="answer2" onclick="checkAnswer(2)">
        </button>


        <div id="answer-result"></div>


        <div id="explanation">

            <h3>Dlaczego?</h3>

            <p id="why"></p>


            <h3>Warto zapamiętać</h3>

            <p id="remember"></p>


            <p>
                <strong>Podstawa prawna:</strong>
                <span id="legal"></span>
            </p>

        </div>


        <button
            class="main-button"
            id="next-button"
            onclick="nextQuestion()">

            Następne pytanie

        </button>

    </div>


    <!-- WYNIK -->

    <div id="result-screen">

        <h1>Koniec testu 🎉</h1>

        <p>Twój wynik:</p>

        <div class="score" id="final-score"></div>

        <button class="main-button" onclick="restartQuiz()">
            Rozpocznij ponownie
        </button>

    </div>


</div>
