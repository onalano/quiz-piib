<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Quiz PIIB</title>
 
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: linear-gradient(180deg, #eef5ff 0%, #f7f9fc 100%);
    margin: 0;
    padding: 18px;
    color: #172033;
}

.app {
    max-width: 620px;
    margin: 25px auto;
    background: white;
    padding: 26px;
    border-radius: 22px;
    box-shadow: 0 10px 35px rgba(35, 65, 100, 0.12);
    border: 1px solid #e4eaf2;
}

h1 {
    color: #1557b0;
    font-size: 30px;
    margin-top: 0;
    margin-bottom: 10px;
}

h2 {
    font-size: 21px;
    line-height: 1.4;
    margin-top: 18px;
    margin-bottom: 20px;
}

h3 {
    color: #174a7e;
    margin-bottom: 7px;
}

#start-screen {
    text-align: center;
    padding: 15px 5px;
}

#start-screen p {
    color: #647185;
    font-size: 16px;
    margin-bottom: 25px;
}

.main-button {
    width: 100%;
    padding: 15px 18px;
    margin-top: 15px;

    background: linear-gradient(135deg, #1769e0, #1557b0);
    color: white;

    border: none;
    border-radius: 13px;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    box-shadow: 0 5px 12px rgba(23, 105, 224, 0.2);
}

.main-button:hover {
    background: #1255ba;
}

.main-button:active {
    transform: scale(0.99);
}

.answer {
    display: block;

    width: 100%;

    margin: 11px 0;
    padding: 16px;

    border: 1px solid #ccd6e3;
    border-radius: 14px;

    background: white;
    color: #172033;

    text-align: left;

    font-size: 16px;
    line-height: 1.35;

    cursor: pointer;

    transition: 0.15s;
}

.answer:hover {
    background: #f3f7fc;
    border-color: #8dacd4;
}

.answer:disabled {
    color: #172033;
    opacity: 1;
    cursor: default;
}

.correct {
    background: #e5f7eb !important;
    border: 2px solid #36985b !important;
}

.wrong {
    background: #fff0f0 !important;
    border: 2px solid #d94d4d !important;
}

#quiz-screen,
#result-screen,
#explanation,
#next-button {
    display: none;
}

.progress {
    display: inline-block;

    background: #eef5ff;
    color: #1557b0;

    padding: 7px 12px;

    border-radius: 100px;

    font-size: 13px;
    font-weight: 700;

    margin: 0 0 8px 0;
}

#answer-result {
    margin-top: 18px;
}

#explanation {
    margin-top: 18px;

    padding: 18px;

    background: #f2f7fd;

    border-left: 4px solid #1769e0;
    border-radius: 12px;

    line-height: 1.5;
}

#explanation h3:first-child {
    margin-top: 0;
}

#explanation p {
    margin-top: 5px;
}

#result-screen {
    text-align: center;
    padding: 15px 5px;
}

.score {
    font-size: 48px;
    font-weight: 800;

    color: #1769e0;

    margin: 20px 0;
}

@media (max-width: 500px) {

    body {
        padding: 10px;
    }

    .app {
        margin: 10px auto;
        padding: 20px;
        border-radius: 18px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 19px;
    }

    .answer {
        padding: 15px;
        font-size: 15px;
    }
}
</style>
</head>
 
<body>
 
<div class="app">
 
<div id="start-screen">
 
<h1>Quiz PIIB</h1>
 
<p>
Przygotowanie do egzaminu na uprawnienia budowlane
</p>
 
<button class="main-button" onclick="startQuiz()">
Rozpocznij test
</button>
 
</div>
 
 
<div id="quiz-screen">
 
<p class="progress" id="progress"></p>
 
<h2 id="question"></h2>
 
<button class="answer" id="answer0"
onclick="checkAnswer(0)">
</button>
 
<button class="answer" id="answer1"
onclick="checkAnswer(1)">
</button>
 
<button class="answer" id="answer2"
onclick="checkAnswer(2)">
</button>
 
<div id="answer-result"></div>
 
<div id="explanation">
 
<h3>Dlaczego?</h3>
<p id="why"></p>
 
<h3>Warto zapamiętać</h3>
<p id="remember"></p>
 
<p>
<strong>Podstawa prawna:</strong>
<span id="legal"></span>
</p>
 
</div>
 
<button
class="main-button"
id="next-button"
onclick="nextQuestion()">
Następne pytanie
</button>
 
</div>
 
 
<div id="result-screen">
 
<h1>Test zakończony 🎉</h1>
 
<p>Twój wynik:</p>
 
<div class="score" id="final-score"></div>
 
<button class="main-button" onclick="startQuiz()">
Nowy test
</button>
 
</div>
 
</div>
 
 
<script>
 
const questions = [
{
question: "Ustawa Prawo budowlane normuje sprawy utrzymania i rozbiórki:",
answers: [
"A. tylko budynków mieszkalnych i użyteczności publicznej",
"B. obiektów budowlanych",
"C. tylko budynków trwale związanych z gruntem"
],
correct: 1,
why: "Prawo budowlane reguluje projektowanie, budowę, utrzymanie i rozbiórkę obiektów budowlanych.",
remember: "Pojęcie „obiekt budowlany” jest szersze niż samo pojęcie „budynek”.",
legal: "art. 1 ustawy Prawo budowlane"
},
 
{
question: "Ustawa Prawo budowlane normuje sprawy budowy:",
answers: [
"A. tylko obiektów realizowanych ze środków publicznych",
"B. tylko budynków trwale związanych z gruntem",
"C. obiektów budowlanych"
],
correct: 2,
why: "Prawo budowlane obejmuje budowę obiektów budowlanych, a nie wyłącznie budynków lub inwestycji publicznych.",
remember: "Zwracaj uwagę na odpowiedzi zawierające słowa „tylko”, „wyłącznie” lub „zawsze”.",
legal: "art. 1 ustawy Prawo budowlane"
},
 
{
question: "Czy ustawę Prawo budowlane stosuje się do wyrobisk górniczych?",
answers: [
"A. Tak",
"B. Nie",
"C. Stosuje się w zależności od decyzji o lokalizacji"
],
correct: 1,
why: "Ustawa Prawo budowlane wskazuje, że jej przepisów nie stosuje się do wyrobisk górniczych.",
remember: "Wyrobiska górniczego nie należy utożsamiać z każdym obiektem budowlanym związanym z działalnością górniczą.",
legal: "art. 2 ust. 1 ustawy Prawo budowlane"
}
];
 
let currentQuestion = 0;
let score = 0;
let answered = false;
 
 
function startQuiz() {
currentQuestion = 0;
score = 0;
 
document.getElementById("start-screen").style.display = "none";
document.getElementById("result-screen").style.display = "none";
document.getElementById("quiz-screen").style.display = "block";
 
showQuestion();
}
 
 
function showQuestion() {
answered = false;
 
const q = questions[currentQuestion];
 
document.getElementById("progress").textContent =
"Pytanie " + (currentQuestion + 1) + " z " + questions.length;
 
document.getElementById("question").textContent = q.question;
 
for (let i = 0; i < 3; i++) {
const button = document.getElementById("answer" + i);
 
button.textContent = q.answers[i];
button.disabled = false;
button.classList.remove("correct", "wrong");
}
 
document.getElementById("answer-result").innerHTML = "";
document.getElementById("explanation").style.display = "none";
document.getElementById("next-button").style.display = "none";
}
 
 
function checkAnswer(selected) {
if (answered) return;
 
answered = true;
 
const q = questions[currentQuestion];
 
const selectedButton =
document.getElementById("answer" + selected);
 
const correctButton =
document.getElementById("answer" + q.correct);
 
if (selected === q.correct) {
 
score++;
 
selectedButton.classList.add("correct");
 
document.getElementById("answer-result").innerHTML =
"<h3 style='color:green'>✓ Dobra odpowiedź!</h3>";
 
} else {
 
selectedButton.classList.add("wrong");
correctButton.classList.add("correct");
 
document.getElementById("answer-result").innerHTML =
"<h3 style='color:#d62828'>✕ Zła odpowiedź</h3>" +
"<p>Prawidłowa odpowiedź: <strong>" +
q.answers[q.correct] +
"</strong></p>";
}
 
for (let i = 0; i < 3; i++) {
document.getElementById("answer" + i).disabled = true;
}
 
document.getElementById("why").textContent = q.why;
document.getElementById("remember").textContent = q.remember;
document.getElementById("legal").textContent = q.legal;
 
document.getElementById("explanation").style.display = "block";
 
const nextButton = document.getElementById("next-button");
 
if (currentQuestion === questions.length - 1) {
nextButton.textContent = "Zobacz wynik";
} else {
nextButton.textContent = "Następne pytanie";
}
 
nextButton.style.display = "block";
}
 
 
function nextQuestion() {
currentQuestion++;
 
if (currentQuestion < questions.length) {
showQuestion();
} else {
showResult();
}
}
 
 
function showResult() {
document.getElementById("quiz-screen").style.display = "none";
document.getElementById("result-screen").style.display = "block";
 
const percent =
Math.round((score / questions.length) * 100);
 
document.getElementById("final-score").textContent =
score + "/" + questions.length + " — " + percent + "%";
}
 
</script>
 
</body>
</html>
